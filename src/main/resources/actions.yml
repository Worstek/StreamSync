# =======================================================
#               StreamSync - actions.yml
#       Interactive Stream Actions (TikTok Live)
# =======================================================
#
# Available actions:
#   GOAL_ADDTIME, GOAL_REMOVETIME, GOAL_WIN, GOAL_LOSE,
#   HEART_GIVE, HEART_REMOVE, HEART_REGENERATE,
#   SPAWN_MOB, EFFECT, RANDOM_EFFECT, RANDOM_EVENT,
#   ITEM_GIVE, TRAP, HOTBAR_SCRAMBLE, FREEZE, SLAP,
#   JUMPSCARE_SOUND, LAUNCH_UP, DROP_HAND, DROP_RANDOM,
#   CLEAR_HAND, LIGHTNING, EXPLOSION, IGNITE, SPIN,
#   FAKE_HISS, ANVIL_FALL, LOOK_SKY, LOOK_GROUND, COMMAND
#
# Universal Placeholders:
#   %user%     - viewer's display name
#   %gift%     - gift name
#   %amount%   - gift / likes amount
#   %message%  - viewer's chat message
#   %streamer% - streamer's player name
#   %mob%      - resolved mob name (when SPAWN_MOB is used)
#   %item%     - resolved item name (when ITEM_GIVE is used)
#   %block%    - resolved trap block (when TRAP is used)
#   %effect%   - resolved effect name (when EFFECT is used)
#
# RANDOM Support:
#   You can write RANDOM (or ranges like "1-5", "5-15") for:
#   - mob: RANDOM (and optional pool: [CREEPER, ZOMBIE, ...])
#   - item: RANDOM (and optional pool: [DIAMOND, GOLD_INGOT, ...])
#   - effect: RANDOM (and optional pool: [SPEED, BLINDNESS, ...])
#   - block: RANDOM (and optional pool: [COBWEB, OBSIDIAN, ...])
#   - sound: RANDOM (and optional sound-pool: [...])
#   - sound-name: RANDOM (in JUMPSCARE_SOUND)
#   - amount: RANDOM or "1-5" (in SPAWN_MOB, ITEM_GIVE, HEART_*)
#   - duration: RANDOM or "3-10" (in TRAP, FREEZE, IGNITE, EFFECT)
#   - power: RANDOM or "1-3" (in SLAP, LAUNCH_UP, EXPLOSION)
#   - time: RANDOM (in GOAL_ADDTIME, GOAL_REMOVETIME)
#   - yaw: RANDOM (in SPIN)

# =======================================================
# 1. STREAM CHAT TRIGGERS (Viewer types keyword -> action!)
# =======================================================
chat-triggers:
  enabled: true
  triggers:
    "creeper":
      action: SPAWN_MOB
      mob: CREEPER
      amount: 1
      radius: 2.0
      name: "&cCreeper from &e%user%"
      sound: ENTITY_CREEPER_PRIMED
      title: "&c&lCREEPER"
      subtitle: "&7Spawned by &e%user%"

    "web":
      action: TRAP
      block: COBWEB
      radius: 1
      height: 2
      duration: 5
      fill-inside: true
      sound: BLOCK_COBWEB_PLACE
      title: "&f&lCOBWEB TRAP!"
      subtitle: "&75 seconds from &e%user%"

    "random":
      action: RANDOM_EVENT
      sound: ENTITY_PLAYER_LEVELUP
      title: "&e&l? RANDOM EVENT ?"
      subtitle: "&7Triggered by &e%user%"
      pool:
        - "creeper"
        - "web"

# =======================================================
# 2. LIKES (Triggers every N likes)
# =======================================================
likes:
  enabled: true
  step: 10 # Every 10 likes
  action: RANDOM_EFFECT
  duration: 6
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  title: "&d&l+10 LIKES!"
  subtitle: "&7Random effect applied!"

# =======================================================
# 3. GIFTS (TIKTOK GIFTS)
# You can set actions for specific gift names OR whole categories from giftLists!
# =======================================================
gifts:
  enabled: true

  "Rose":
    action: GOAL_ADDTIME
    time: "30s"
    sound: ENTITY_PLAYER_LEVELUP
    title: "&d&lROSE &8» &f%user%"
    subtitle: "&a+30s to challenge time!"

  "TikTok":
    action: HEART_REMOVE
    amount: 1
    sound: ENTITY_PLAYER_HURT
    title: "&d&lTIKTOK &8» &f%user%"
    subtitle: "&c-1 Max Heart!"

  "Panda":
    action: HEART_GIVE
    amount: 1
    sound: ENTITY_PLAYER_LEVELUP
    title: "&e&lPANDA &8» &f%user%"
    subtitle: "&a+1 Max Heart!"

  "Lion":
    action: GOAL_WIN
    sound: UI_TOAST_CHALLENGE_COMPLETE
    title: "&6&lLION &8» &f%user%"
    subtitle: "&a&lINSTANT CHALLENGE VICTORY!"

  "default":
    action: ITEM_GIVE
    item: RANDOM # Gives random item from default pool!
    amount: "1-3" # Gives random 1 to 3 items!
    drop-if-full: true
    sound: RANDOM # Plays random pleasant sound!
    title: "&a&lGIFT &e%gift%!"
    subtitle: "&7Sent &e%amount%x %item% &7by &f%user%"

