# =======================================================
# 6. ALL AVAILABLE ACTIONS EXAMPLES (Cheat Sheet):
# =======================================================
#
# # 1. SPAWN_MOB - spawns mobs (supports mob: RANDOM or pool: [...])
# example_mob:
#   action: SPAWN_MOB
#   mob: RANDOM # Or CREEPER, ZOMBIE, SKELETON, etc.
#   pool: # (optional custom pool of mobs to choose from)
#     - "CREEPER"
#     - "ZOMBIE"
#     - "SKELETON"
#     - "WARDEN"
#   amount: "1-5" # Or fixed number 3, or "RANDOM"
#   radius: 3.0
#   name: "&c%mob% from &e%user%"
#   sound: RANDOM # Plays random sound!
#   title: "&c&l!MOB: %mob%"
#   subtitle: "&7Spawned by &e%user%"
#
# # 2. EFFECT - gives potion effect (supports effect: RANDOM or pool: [...])
# example_effect:
#   action: EFFECT
#   effect: RANDOM # Or BLINDNESS, SPEED, LEVITATION, NAUSEA, etc.
#   pool: # (optional pool)
#     - "BLINDNESS"
#     - "LEVITATION"
#     - "SPEED"
#     - "NAUSEA"
#   duration: "5-15" # Or fixed 10 seconds, or "RANDOM"
#   amplifier: 1
#   particles: true
#   title: "&e&lEFFECT: %effect%"
#   subtitle: "&7From &e%user%"
#
# # 3. RANDOM_EFFECT - applies a random effect from pool
# example_rand_effect:
#   action: RANDOM_EFFECT
#   duration: 8
#   amplifier: 1
#   pool: # optional pool of effects
#     - "BLINDNESS"
#     - "LEVITATION"
#     - "SPEED"
#     - "NAUSEA"
#
# # 4. RANDOM_EVENT - triggers a random action from chat-triggers
# example_rand_event:
#   action: RANDOM_EVENT
#   pool: # optional list of triggers to choose from
#     - "!creeper"
#     - "!web"
#
# # 5. ITEM_GIVE - gives item (supports item: RANDOM or pool: [...])
# example_item:
#   action: ITEM_GIVE
#   item: RANDOM # Or DIAMOND, GOLDEN_APPLE, etc.
#   pool: # (optional pool)
#     - "DIAMOND"
#     - "EMERALD"
#     - "GOLDEN_APPLE"
#   amount: "1-5" # Random 1-5 or fixed number
#   drop-if-full: true
#   title: "&a&lITEM: %item%"
#   subtitle: "&7Given to streamer by &e%user%"
#
# # 6. TRAP - places temporary blocks around the player (supports block: RANDOM)
# example_trap:
#   action: TRAP
#   block: RANDOM # Or COBWEB, OBSIDIAN, SLIME_BLOCK, ICE, GLASS, etc.
#   pool: # (optional pool)
#     - "COBWEB"
#     - "OBSIDIAN"
#     - "SLIME_BLOCK"
#   radius: 1
#   height: 2
#   duration: "3-8" # Random 3-8 seconds
#   fill-inside: false
#   title: "&f&lTRAP: %block%"
#   subtitle: "&7Trapped by &e%user%"
#
# # 7. HOTBAR_SCRAMBLE - shuffles items in player's hotbar
# example_scramble:
#   action: HOTBAR_SCRAMBLE
#   sound: ITEM_ARMOR_EQUIP_GENERIC
#
# # 8. FREEZE - freezes player on the spot for X seconds
# example_freeze:
#   action: FREEZE
#   duration: "2-6" # Random 2 to 6 seconds
#
# # 9. SLAP - knocks player back in a random direction
# example_slap:
#   action: SLAP
#   power: "1.0-3.0" # Random knockback power
#
# # 10. JUMPSCARE_SOUND - plays loud scary sound (supports sound-name: RANDOM)
# example_jumpscare:
#   action: JUMPSCARE_SOUND
#   sound-name: RANDOM # Or "ENTITY_ENDER_DRAGON_GROWL", "ENTITY_WARDEN_ROAR"
#   pool: # (optional pool)
#     - "ENTITY_ENDER_DRAGON_GROWL"
#     - "ENTITY_WARDEN_ROAR"
#     - "ENTITY_GHAST_SCREAM"
#
# # 11. LAUNCH_UP - launches player up into the sky
# example_launch:
#   action: LAUNCH_UP
#   power: "1.0-2.5"
#
# # 12. DROP_HAND - drops current held item to floor
# example_drop_hand:
#   action: DROP_HAND
#
# # 13. DROP_RANDOM - drops 1 random item from anywhere in inventory
# example_drop_rand:
#   action: DROP_RANDOM
#
# # 14. CLEAR_HAND - completely deletes held item
# example_clear_hand:
#   action: CLEAR_HAND
#
# # 15. LIGHTNING - strikes lightning on player
# example_lightning:
#   action: LIGHTNING
#
# # 16. EXPLOSION - creates an explosion
# example_explosion:
#   action: EXPLOSION
#   power: "1.0-3.5"
#   break-blocks: false
#   set-fire: false
#
# # 17. IGNITE - sets player on fire
# example_ignite:
#   action: IGNITE
#   duration: "3-8" # in seconds
#
# # 18. SPIN - spins camera (supports yaw: RANDOM)
# example_spin:
#   action: SPIN
#   yaw: RANDOM # Or 180.0, 90.0, etc.
#
# # 19. FAKE_HISS - plays creeper priming sound
# example_hiss:
#   action: FAKE_HISS
#
# # 20. ANVIL_FALL - drops a falling anvil from the sky
# example_anvil:
#   action: ANVIL_FALL
#
# # 21. LOOK_SKY / LOOK_GROUND - snaps camera looking up/down
# example_look_sky:
#   action: LOOK_SKY
# example_look_ground:
#   action: LOOK_GROUND
#
# # 22. GOAL_ADDTIME - adds time to active stream challenge (supports time: RANDOM)
# example_add_time:
#   action: GOAL_ADDTIME
#   time: RANDOM # Or "30s", "1m", "5m"
#   pool: # (optional pool of times)
#     - "30s"
#     - "1m"
#     - "2m"
#
# # 23. GOAL_REMOVETIME - removes time from active challenge (supports time: RANDOM)
# example_rem_time:
#   action: GOAL_REMOVETIME
#   time: RANDOM # Or "1m"
#
# # 24. GOAL_WIN - instantly completes challenge
# example_goal_win:
#   action: GOAL_WIN
#
# # 25. GOAL_LOSE - instantly fails challenge
# example_goal_lose:
#   action: GOAL_LOSE
#
# # 26. HEART_GIVE - adds extra max heart (supports amount: RANDOM or "1-3")
# example_heart_give:
#   action: HEART_GIVE
#   amount: "1-3" # 1 to 3 hearts
#
# # 27. HEART_REMOVE - removes max heart (protected to 1 heart min)
# example_heart_remove:
#   action: HEART_REMOVE
#   amount: "1-2"
#
# # 28. HEART_REGENERATE - instantly heals missing hearts
# example_heart_regen:
#   action: HEART_REGENERATE
#   amount: "1-3" # heals 1 to 3 hearts
#
# # 29. COMMAND - executes console command
# example_command:
#   action: COMMAND
#   command: "give %streamer% golden_apple 1"
#   # Or multiple commands:
#   # commands:
#   #   - "give %streamer% diamond 1"
#   #   - "say %streamer% received diamond!"
